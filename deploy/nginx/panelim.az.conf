# Production Nginx reverse proxy for panelim.az (Next.js standalone/start on 127.0.0.1:3000)
# Place in /etc/nginx/sites-available/panelim.az.conf and enable via sites-enabled.

upstream panelim_next {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name panelim.az www.panelim.az;
  return 301 https://panelim.az$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name panelim.az www.panelim.az;

  ssl_certificate /etc/letsencrypt/live/panelim.az/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/panelim.az/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  client_max_body_size 10m;

  location /_next/static/ {
    proxy_pass http://panelim_next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://panelim_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
