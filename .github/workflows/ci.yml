name: CI

on:
  push:
    branches: [master, main, 'feat/panelim-subpages', 'feat/pani-crm-intake-core', 'fix/crm-customer-readiness']
  pull_request:
    branches: [master, main, 'feat/panelim-subpages']

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: panelim_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d panelim_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: SQLite and unit tests
        run: npm test
      - name: Apply PostgreSQL schema and create non-superuser test role
        env:
          PG_ADMIN_URL: postgresql://postgres:local_ci_password@127.0.0.1:5432/panelim_ci
        run: node scripts/ci-prepare-postgres.mjs
      - name: PostgreSQL integration, isolation, concurrency and rollback
        env:
          QEYDAI_DATABASE_URL: postgresql://panelim_ci:local_app_password@127.0.0.1:5432/panelim_ci
        run: npm run test:pg
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright desktop (independent)
        run: npx playwright test --project=desktop
      - name: Playwright mobile (independent)
        run: npx playwright test --project=mobile
      - name: Playwright desktop and mobile (combined regression)
        run: npm run e2e
      - name: PostgreSQL-backed business registration and CRM Playwright (desktop/mobile)
        env:
          QEYDAI_DATABASE_URL: postgresql://panelim_ci:local_app_password@127.0.0.1:5432/panelim_ci
        run: npx playwright test --config playwright.pg.config.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Publish CRM release-gate success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=crm-release-gate \
            -f description="All configured CI checks passed"

      - name: Publish CRM release-gate failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure -f context=crm-release-gate \
            -f description="A required CI step failed"
